# Runs the test suite on every push and pull request. No secrets are needed: tests use the in-memory store and fakes.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19, mid-judging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"  # same as Dockerfile
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
